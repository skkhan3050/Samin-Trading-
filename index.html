<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRADELAB | Crypto Trading Strategies, Market Analysis & Education</title>
    <meta name="description" content="Explore structured crypto trading strategies, technical market analysis, trading education, and risk management frameworks designed for disciplined traders." />
    <meta name="keywords" content="crypto trading strategies, market analysis, technical analysis, risk management, trading education, bitcoin trading, price action" />
    <meta name="theme-color" content="#08111F" />
    
    <!-- OpenGraph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TRADELAB | Trade With a Strategy. Not With Emotion." />
    <meta property="og:description" content="Practical crypto trading strategies built around market structure, technical analysis, and disciplined risk management." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body class="bg-primary text-main font-sans antialiased overflow-x-hidden selection-neon">
    <!-- Subtle Background Trading Grid & Particle Canvas -->
    <div class="cyber-grid-overlay" aria-hidden="true"></div>
    <div class="glow-orb glow-orb-top" aria-hidden="true"></div>
    <div class="glow-orb glow-orb-mid" aria-hidden="true"></div>
    <canvas id="trading-matrix-canvas" class="matrix-canvas" aria-hidden="true"></canvas>

    <!-- App Container -->
    <div id="app">
      <!-- Header / Navigation -->
      <header id="site-header" class="site-header"></header>

      <!-- Main Content Sections -->
      <main id="main-content">
        <!-- Hero Section -->
        <section id="hero" class="hero-section"></section>

        <!-- Market Ticker & Trust Strip -->
        <section id="market-strip" class="trust-section"></section>

        <!-- Trusted by 185k Traders Worldwide Brand Marquee -->
        <section id="trusted-brands" class="trusted-brands-wrapper"></section>

        <!-- 24/7 Human Support World Map Section -->
        <section id="human-support" class="support-section-wrapper"></section>

        <!-- Main Value Proposition + 3 Audience Cards -->
        <section id="audience-cards" class="audience-section"></section>

        <!-- Featured Trading Strategy (Editorial Block) -->
        <section id="featured-strategy" class="featured-strategy-section"></section>

        <!-- Strategy Products Section -->
        <section id="strategy-products" class="strategy-products-section"></section>

        <!-- Interactive Funded Account Pricing Section -->
        <section id="account-pricing" class="tdfy-pricing-section-v2"></section>

        <!-- Market Analysis with Category Tabs -->
        <section id="market-analysis" class="analysis-section"></section>

        <!-- How the Strategy Works (4-Step Process) -->
        <section id="trading-process" class="process-section"></section>

        <!-- Trading Education Section -->
        <section id="trading-education" class="education-section"></section>

        <!-- Trader Leaderboard Section (Open 1, Open 2, Creator League) -->
        <section id="leaderboard" class="ptl-leader-sec-main"></section>

        <!-- Premium Complete Strategy Showcase -->
        <section id="premium-strategy" class="premium-product-section"></section>

        <!-- Why This Platform (Process over Predictions) -->
        <section id="why-platform" class="why-platform-section"></section>

        <!-- Residential Proxies Section -->
        <section id="residential-proxies" class="residential-proxies-section"></section>

        <!-- Pricing / Strategy Plans -->
        <section id="pricing" class="pricing-section"></section>

        <!-- Community Section -->
        <section id="community" class="community-section"></section>

        <!-- Lead Generation / Strategy Request Form -->
        <section id="contact-form" class="demo-section"></section>

        <!-- FAQ Section -->
        <section id="faq" class="faq-section"></section>

        <!-- Prominent Risk Disclaimer -->
        <section id="risk-disclaimer" class="disclaimer-section"></section>
      </main>

      <!-- Enterprise Footer -->
      <footer id="site-footer" class="site-footer"></footer>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Main JS Application Entrypoint -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
